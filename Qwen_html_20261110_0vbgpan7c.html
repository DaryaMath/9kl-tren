// ===== АЛГОРИТМЫ =====
function dijkstra(edges, nodes, start, end, forbidden=null) {
  const dist = {};
  nodes.forEach(n => dist[n] = Infinity);
  dist[start] = 0;
  const visited = {};
  for (let i = 0; i < nodes.length; i++) {
    let u = null;
    for (const n of nodes) {
      if (!visited[n] && (u === null || dist[n] < dist[u])) u = n;
    }
    if (u === null || dist[u] === Infinity) break;
    visited[u] = true;
    if (edges[u]) {
      for (const v in edges[u]) {
        if (forbidden && forbidden.has(v)) continue;
        const alt = dist[u] + edges[u][v];
        if (alt < dist[v]) dist[v] = alt;
      }
    }
  }
  return dist[end];
}

  let best = Infinity;
  if (edges[current]) {
    for (const next in edges[current]) {
      if (!visited.has(next)) {
        visited.add(next);
        const d = dfsPath(edges, next, target, visited, currentDist + edges[current][next]);
        if (d < best) best = d;
        visited.delete(next);
      }
    }
  }
  return best;
}

function solveProblem(p) {
  if (p.special === 'max_edge') {
    // Находим кратчайший путь и возвращаем максимальное ребро на нём
    const path = findShortestPath(p.edges, p.nodes, p.start, p.end);
    if (!path) return Infinity;
    let maxEdge = 0;
    for (let i = 0; i < path.length - 1; i++) {
      const w = p.edges[path[i]][path[i+1]];
      if (w > maxEdge) maxEdge = w;
    }
    return maxEdge;
  }
  
  if (p.no_repeat && !p.through) {
    const visited = new Set([p.start]);
    return dfsPath(p.edges, p.start, p.end, visited, 0);
  }
  
  if (p.through && p.no_repeat) {
    // через X без повторений - перебор
    return dfsThroughNoRepeat(p.edges, p.start, p.end, p.through, p.nodes);
  }
  
  if (p.through) {
    const d1 = dijkstra(p.edges, p.nodes, p.start, p.through);
    const d2 = dijkstra(p.edges, p.nodes, p.through, p.end);
    if (d1 === Infinity || d2 === Infinity) return Infinity;
    return d1 + d2;
  }
  
  return dijkstra(p.edges, p.nodes, p.start, p.end);
}

function findShortestPath(edges, nodes, start, end) {
  const dist = {}; const prev = {};
  nodes.forEach(n => { dist[n] = Infinity; prev[n] = null; });
  dist[start] = 0;
  const visited = {};
  for (let i = 0; i < nodes.length; i++) {
    let u = null;
    for (const n of nodes) if (!visited[n] && (u === null || dist[n] < dist[u])) u = n;
    if (u === null || dist[u] === Infinity) break;
    visited[u] = true;
    if (edges[u]) for (const v in edges[u]) {
      const alt = dist[u] + edges[u][v];
      if (alt < dist[v]) { dist[v] = alt; prev[v] = u; }
    }
  }
  if (dist[end] === Infinity) return null;
  const path = [];
  let cur = end;
  while (cur) { path.unshift(cur); cur = prev[cur]; }
  return path;
}

function dfsThroughNoRepeat(edges, start, end, through, nodes) {
  // Перебор всех путей start -> end без повторений, проходящих через through
  let best = Infinity;
  function dfs(current, target, visited, dist, mustPassThrough, passedThrough) {
    if (current === target) {
      if (mustPassThrough && !passedThrough) return Infinity;
      return dist;
    }
    let b = Infinity;
    if (edges[current]) for (const next in edges[current]) {
      if (!visited.has(next)) {
        visited.add(next);
        const pt = passedThrough || (next === mustPassThrough) || (current === mustPassThrough);
        const d = dfs(next, target, visited, dist + edges[current][next], mustPassThrough, pt);
        if (d < b) b = d;
        visited.delete(next);
      }
    }
    return b;
  }
  const visited = new Set([start]);
  const initPT = (start === through);
  return dfs(start, end, visited, 0, through, initPT);
}

// ===== UI =====
let currentMode = null; // 'training' or 'test'
let currentProblems = [];
let currentIndex = 0;
let correctCount = 0;
let results = [];

function startTraining() {
  currentMode = 'training';
  currentProblems = problems.slice(0, 40);
  currentIndex = 0;
  correctCount = 0;
  results = [];
  showProblem();
}

function startTest() {
  currentMode = 'test';
  // Перемешиваем и берём 10
  const shuffled = [...problems].sort(() => Math.random() - 0.5);
  currentProblems = shuffled.slice(0, 10);
  currentIndex = 0;
  correctCount = 0;
  results = [];
  showProblem();
}

function showProblem() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('problem-screen').classList.remove('hidden');
  
  const p = currentProblems[currentIndex];
  document.getElementById('progress').textContent = 
    `Задание ${currentIndex + 1} из ${currentProblems.length}`;
  document.getElementById('problem-text').textContent = p.text;
  
  // Таблица
  let html = '<table class="matrix"><tr><th></th>';
  for (const n of p.nodes) html += `<th>${n}</th>`;
  html += '</tr>';
  for (const row of p.nodes) {
    html += `<tr><td class="header">${row}</td>`;
    for (const col of p.nodes) {
      if (row === col) html += '<td class="empty">—</td>';
      else if (p.edges[row] && p.edges[row][col] !== undefined) 
        html += `<td>${p.edges[row][col]}</td>`;
      else html += '<td class="empty"></td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('matrix-container').innerHTML = html;
  
  document.getElementById('answer-input').value = '';
  document.getElementById('answer-input').focus();
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').classList.add('hidden');
}

function checkAnswer() {
  const input = document.getElementById('answer-input').value.trim();
  if (input === '') {
    alert('Введите ответ!');
    return;
  }
  const userAnswer = parseInt(input);
  const p = currentProblems[currentIndex];
  const correctAnswer = solveProblem(p);
  const isCorrect = (userAnswer === correctAnswer);
  
  if (isCorrect) correctCount++;
  results.push({ problem: p, userAnswer, correctAnswer, isCorrect });
  
  const fb = document.getElementById('feedback');
  if (isCorrect) {
    fb.className = 'feedback correct';
    fb.innerHTML = `✅ Правильно! Ответ: ${correctAnswer}`;
  } else {
    fb.className = 'feedback wrong';
    fb.innerHTML = `❌ Неверно. Ваш ответ: ${userAnswer}. Правильный ответ: ${correctAnswer}`;
  }
  
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('next-btn').textContent = 
    (currentIndex === currentProblems.length - 1) ? 'Показать результат →' : 'Далее →';
}

function nextProblem() {
  currentIndex++;
  if (currentIndex >= currentProblems.length) {
    showResult();
  } else {
    showProblem();
  }
}

function showResult() {
  document.getElementById('problem-screen').classList.add('hidden');
  const rs = document.getElementById('result-screen');
  rs.classList.remove('hidden');
  
  const total = currentProblems.length;
  const percent = Math.round((correctCount / total) * 100);
  let grade, gradeClass, emoji;
  if (percent >= 90) { grade = 5; gradeClass = 'grade-5'; emoji = '🏆'; }
  else if (percent >= 75) { grade = 4; gradeClass = 'grade-4'; emoji = '👍'; }
  else if (percent >= 50) { grade = 3; gradeClass = 'grade-3'; emoji = '📚'; }
  else { grade = 2; gradeClass = 'grade-2'; emoji = '💪'; }
  
  let html = `<div class="result-screen">
    <h1>${emoji} ${currentMode === 'test' ? 'ИТОГОВЫЙ ТЕСТ' : 'ТРЕНИРОВКА'} ЗАВЕРШЕН(А)</h1>
    <div class="result-grade ${gradeClass}">${grade}</div>
    <div class="result-percent">${percent}%</div>
    <div class="stats">
      <div class="stat-box"><div class="num">${correctCount}</div><div class="label">Правильных</div></div>
      <div class="stat-box"><div class="num">${total - correctCount}</div><div class="label">Ошибок</div></div>
      <div class="stat-box"><div class="num">${total}</div><div class="label">Всего заданий</div></div>
    </div>
    <div class="result-list">`;
  
  results.forEach((r, i) => {
    const cls = r.isCorrect ? 'ok' : 'fail';
    const mark = r.isCorrect ? '✓' : '✗';
    const shortText = r.problem.text.substring(0, 70) + '...';
    html += `<div class="result-list-item ${cls}">
      ${mark} <b>№${i+1}:</b> Ваш ответ: ${r.userAnswer} | Верно: ${r.correctAnswer}
    </div>`;
  });
  
  html += `</div>
    <button class="menu-btn" onclick="backToMenu()" style="margin-top:30px;">🏠 В главное меню</button>
  </div>`;
  
  rs.innerHTML = html;
}

function backToMenu() {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('problem-screen').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
}

// Enter для проверки ответа
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!document.getElementById('problem-screen').classList.contains('hidden')) {
      const nextBtn = document.getElementById('next-btn');
      if (!nextBtn.classList.contains('hidden')) {
        nextProblem();
      } else {
        checkAnswer();
      }
    }
  }
});
</script>
